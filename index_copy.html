<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Game</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="game-container">
        <!-- Game Canvas -->
        <canvas id="gameCanvas" width="400" height="550"></canvas>
        
        <!-- Live Score Screen -->
        <div id="score-display" class="hide">0</div>

        <!-- Start / Game Over UI Overlay -->
        <div id="ui-overlay">
            <h1 id="ui-title">FLAPPY BIRD</h1>
            <p id="ui-msg">Press Spacebar or Tap to Fly</p>
            <button id="action-btn">START GAME</button>
        </div>
    </div>

    <script src="./script_copy.js"></script>
</body>
</html>
